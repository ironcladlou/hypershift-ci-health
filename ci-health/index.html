<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg height='1024' width='768' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M640 448c-47.625 0-88.625 26.312-110.625 64.906C523.625 512.5 518 512 512 512c-131.062 0-255.438-99.844-300.812-223.438C238.469 265.094 256 230.719 256 192c0-70.656-57.344-128-128-128S0 121.344 0 192c0 47.219 25.844 88.062 64 110.281V721.75C25.844 743.938 0 784.75 0 832c0 70.625 57.344 128 128 128s128-57.375 128-128c0-47.25-25.844-88.062-64-110.25V491.469C276.156 580.5 392.375 640 512 640c6.375 0 11.625-0.438 17.375-0.625C551.5 677.812 592.5 704 640 704c70.625 0 128-57.375 128-128C768 505.344 710.625 448 640 448zM128 896c-35.312 0-64-28.625-64-64 0-35.312 28.688-64 64-64 35.406 0 64 28.688 64 64C192 867.375 163.406 896 128 896zM128 256c-35.312 0-64-28.594-64-64s28.688-64 64-64c35.406 0 64 28.594 64 64S163.406 256 128 256zM640 640c-35.312 0-64-28.625-64-64 0-35.406 28.688-64 64-64 35.375 0 64 28.594 64 64C704 611.375 675.375 640 640 640z'/%3E%3C/svg%3E">
<title>HyperShift CI Health</title>
<style>
:root {
  --surface: #fcfcfb;
  --surface-page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --gridline: #e1e0d9;
  --baseline: #c3c2b7;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --delta-good: #006300;
  --delta-bad: #d03b3b;
  --series-1: #2a78d6;
  --series-2: #0e9aa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19;
    --surface-page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --delta-good: #0ca30c;
    --delta-bad: #e66767;
    --series-1: #3987e5;
    --series-2: #1ab5c4;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  line-height: 1.5;
  padding: 24px 32px;
  max-width: 1400px;
  margin: 0 auto;
}
h1 { font-size: 20px; font-weight: 600; }
.header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.header-meta {
  font-size: 13px;
  color: var(--text-muted);
}
.alert-banner {
  background: color-mix(in srgb, var(--critical) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--critical) 25%, var(--surface));
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: none;
}
.alert-banner h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.alert-banner ul {
  list-style: none;
  font-size: 13px;
  color: var(--text-secondary);
}
.alert-banner li { padding: 2px 0; }
.alert-banner .test-name { color: var(--text-primary); font-weight: 500; }
.alert-banner .job-names { color: var(--text-muted); font-size: 12px; }

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--gridline);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
thead th {
  text-align: left;
  font-weight: 500;
  color: var(--text-muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--baseline);
  white-space: nowrap;
}
tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--gridline);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
.job-name a {
  color: var(--text-primary);
  text-decoration: none;
  font-weight: 400;
}
.job-name a:hover { text-decoration: underline; }
.category-row td {
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-primary);
  background: color-mix(in srgb, var(--series-1) 10%, var(--surface-page));
  border-bottom: 1px solid color-mix(in srgb, var(--series-1) 20%, var(--gridline));
}
.subcategory-row td {
  padding: 4px 12px 4px 24px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--text-secondary);
  background: var(--surface-page);
}

.pass-rate { font-weight: 500; }
.has-tip { position: relative; }
.tip {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 0;
  background: var(--text-primary);
  color: var(--surface);
  font-size: 11px;
  font-weight: 400;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 10;
}
.has-tip:hover > .tip { display: block; }
.rate-cell { white-space: nowrap; }
.rate-good { color: var(--delta-good); }
.rate-warn { color: color-mix(in srgb, var(--text-primary) 80%, var(--warning)); }
.rate-bad { color: var(--delta-bad); }
.rate-na { color: var(--text-muted); }

.trend-up { color: var(--delta-good); }
.trend-down { color: var(--delta-bad); }
.trend-flat { color: var(--text-muted); }

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.status-good { background: var(--good); }
.status-warn { background: var(--warning); }
.status-bad { background: var(--critical); }
.status-na { background: var(--text-muted); }

.periodic-row td {
  padding-top: 2px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gridline);
  font-size: 12px;
  color: var(--text-secondary);
}
.periodic-row + tr:not(.periodic-row) td,
.periodic-row + .category-row td { border-top: none; }
tr:has(+ .periodic-row) td { border-bottom: none; }
.job-type {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  margin-left: 6px;
}
.job-type .tip {
  text-transform: none;
  letter-spacing: normal;
}
.infra-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--serious);
  margin-left: 6px;
}
.periodic-link {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 12px;
}
.periodic-link:hover { text-decoration: underline; }
.periodic-release {
  font-size: 11px;
  color: var(--text-muted);
}

.sparkline-cell { padding: 4px 4px; }
.rate-chart-cell { padding: 4px 8px; vertical-align: middle; }
.rate-chart-inner { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rate-chart-inner canvas { display: block; flex-shrink: 0; }
.rate-delta { font-size: 12px; }
.sparkline-legend {
  font-size: 11px;
  color: var(--text-muted);
  padding: 8px 12px 0;
  display: flex;
  gap: 16px;
  justify-content: flex-end;
}
.sparkline-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.loading {
  text-align: center;
  padding: 48px;
  color: var(--text-muted);
  font-size: 14px;
}
.loading progress {
  display: block;
  width: min(420px, 80vw);
  height: 10px;
  margin: 14px auto 8px;
  accent-color: var(--link);
}
.loading-detail {
  font-size: 12px;
  color: var(--text-secondary);
}
.header-meta { display: flex; align-items: baseline; gap: 8px; }
.platform-filter {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.platform-filter select {
  border: 1px solid var(--gridline);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-primary);
  font-size: 12px;
  padding: 2px 6px;
}
.perspective-context {
  margin: 2px 0 0 18px;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.35;
}
.perspective-context a { color: var(--text-secondary); }
.refresh-btn {
  background: none;
  border: 1px solid var(--gridline);
  border-radius: 4px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 8px;
  line-height: 1.4;
}
.refresh-btn:hover { color: var(--text-primary); border-color: var(--baseline); }
.refresh-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cache-stale { color: var(--text-muted); }
.cache-fresh { color: var(--delta-good); }
.cache-error { color: var(--serious); }
.window-toggle {
  display: inline-flex;
  border: 1px solid var(--gridline);
  border-radius: 4px;
  overflow: hidden;
}
.window-toggle button {
  background: none;
  border: none;
  border-right: 1px solid var(--gridline);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 10px;
  line-height: 1.4;
}
.window-toggle button:last-child { border-right: none; }
.window-toggle button:hover { color: var(--text-primary); }
.window-toggle button.active {
  background: var(--gridline);
  color: var(--text-primary);
  font-weight: 500;
}
.view-navigation {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 12px;
}
.release-filter {
  display: none;
  align-items: flex-start;
  gap: 12px;
  color: var(--text-muted);
  font-size: 11px;
}
.release-filter-label {
  line-height: 22px;
  white-space: nowrap;
}
.release-filter-label strong {
  color: var(--text-primary);
  font-weight: 500;
  margin-left: 3px;
}
.release-range-control {
  position: relative;
  width: min(420px, 42vw);
  min-width: 280px;
  height: 38px;
}
.release-range-track {
  position: absolute;
  top: 9px;
  right: 7px;
  left: 7px;
  height: 4px;
  border-radius: 2px;
  background: var(--gridline);
}
.release-range-fill {
  position: absolute;
  height: 100%;
  border-radius: inherit;
  background: var(--series-1);
}
.release-range-control input[type="range"] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 22px;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  pointer-events: none;
  background: transparent;
}
.release-range-control input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  background: transparent;
}
.release-range-control input[type="range"]::-webkit-slider-thumb {
  width: 14px;
  height: 14px;
  margin-top: -5px;
  border: 2px solid var(--surface);
  border-radius: 50%;
  appearance: none;
  -webkit-appearance: none;
  pointer-events: auto;
  cursor: grab;
  background: var(--series-1);
  box-shadow: 0 0 0 1px var(--baseline);
}
.release-range-control input[type="range"]::-moz-range-track {
  height: 4px;
  background: transparent;
}
.release-range-control input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 2px solid var(--surface);
  border-radius: 50%;
  pointer-events: auto;
  cursor: grab;
  background: var(--series-1);
  box-shadow: 0 0 0 1px var(--baseline);
}
.release-range-control input[type="range"]:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
}
.release-range-control input[type="range"]:focus-visible::-moz-range-thumb {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
}
.release-range-ticks {
  position: absolute;
  top: 23px;
  right: 0;
  left: 0;
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}
.release-range-ticks span { color: var(--text-muted); }
.release-range-ticks span.selected { color: var(--text-primary); }
@media (max-width: 800px) {
  body { padding: 16px; }
  .header { align-items: flex-start; }
  .header-meta { flex-wrap: wrap; justify-content: flex-end; }
  .view-navigation { flex-direction: column; gap: 8px; }
  .release-filter { width: 100%; }
  .release-range-control { width: 100%; min-width: 0; }
}
.registry-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--text-muted);
  font-size: 12px;
}
.registry-toolbar input {
  width: min(440px, 60vw);
  padding: 5px 8px;
  border: 1px solid var(--gridline);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-primary);
}
.registry-detail { color: var(--text-muted); font-size: 11px; }
.registry-yaml-row td {
  border-top: 0;
}
.registry-yaml-row .registry-yaml-cell {
  padding: 0 12px 12px 12px;
}
.registry-yaml-row .registry-yaml-spacer {
  padding: 0;
}
.registry-yaml-panel {
  position: relative;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  background: color-mix(in srgb, var(--surface) 80%, var(--surface-page));
  border: 1px solid var(--gridline);
  border-radius: 4px;
  overflow: hidden;
}
.registry-yaml-panel pre {
  max-height: 420px;
  margin: 0;
  padding: 12px 14px;
  overflow: auto;
  color: var(--text-secondary);
  font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.yaml-key { color: var(--series-1); font-weight: 600; }
.yaml-string { color: var(--text-primary); }
.yaml-scalar { color: var(--delta-good); }
.yaml-null { color: var(--text-muted); font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>HyperShift CI Health</h1>
    <a href="https://github.com/ironcladlou/hypershift-ci-health" target="_blank" rel="noopener" style="font-size:12px;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Source code</a>
  </div>
  <div class="header-meta">
    <label class="platform-filter" id="platform-filter-wrap">Platform
      <select id="platform-filter" onchange="setPlatformFilter(this.value)">
        <option value="">All</option>
      </select>
    </label>
    <div class="window-toggle" id="group-toggle">
      <button data-group="" onclick="setGroupBy('')">None</button>
      <button data-group="platform" onclick="setGroupBy('platform')">Platform</button>
      <button data-group="release" onclick="setGroupBy('release')">Release</button>
      <button data-group="platform-release" onclick="setGroupBy('platform-release')">Platform / Release</button>
    </div>
    <div class="window-toggle" id="window-toggle">
      <button data-window="1w" onclick="setActiveWindow('1w')">1w</button>
      <button data-window="2w" onclick="setActiveWindow('2w')">2w</button>
      <button data-window="1m" onclick="setActiveWindow('1m')">1m</button>
    </div>
    <span id="last-updated">Loading…</span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadDashboard(true)">↻</button>
  </div>
</div>

<div class="view-navigation">
  <div class="window-toggle" id="view-toggle">
    <button data-view="presubmit" onclick="setActiveView('presubmit')">Presubmit</button>
    <button data-view="payload" onclick="setActiveView('payload')">Release Payload</button>
    <button data-view="component" onclick="setActiveView('component')">Component Readiness</button>
    <button data-view="registry" onclick="setActiveView('registry')">Job Registry</button>
  </div>
  <div class="release-filter" id="release-filter">
    <span class="release-filter-label">Releases <strong id="release-range-label"></strong></span>
    <div class="release-range-control">
      <div class="release-range-track"><span class="release-range-fill" id="release-range-fill"></span></div>
      <input id="release-min" type="range" aria-label="Newest release" oninput="setReleaseBound('min')">
      <input id="release-max" type="range" aria-label="Oldest release" oninput="setReleaseBound('max')">
      <div class="release-range-ticks" id="release-range-ticks" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div id="alert-banner" class="alert-banner"></div>

<div id="dashboard">
  <div class="loading" id="loading">Loading…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<div id="rate-tip" style="position:fixed;display:none;pointer-events:none;z-index:100;background:var(--text-primary);color:var(--surface);font-size:11px;font-weight:400;padding:2px 6px;border-radius:3px;white-space:nowrap"></div>
<div id="spark-tip" style="position:fixed;display:none;pointer-events:none;z-index:100;background:var(--text-primary);color:var(--surface);font-size:11px;font-weight:400;padding:2px 6px;border-radius:3px;white-space:nowrap"></div>

<script>
const SIPPY = "https://sippy.dptools.openshift.org";

const WINDOWS = {
  "1w": { sparkSlotHours: 6, sparkSlots: 28, sparkLabel: "Last 1w", prevLabel: "Prev 1w" },
  "2w": { sparkSlotHours: 12, sparkSlots: 28, sparkLabel: "Last 2w", prevLabel: "Prev 2w" },
  "1m": { sparkSlotHours: 24, sparkSlots: 30, sparkLabel: "Last 1m", prevLabel: "Prev 1m" },
};
let activeWindow = localStorage.getItem("sippy_window") || "1w";
if (!WINDOWS[activeWindow]) activeWindow = "1w";
let activeView = localStorage.getItem("sippy_view") || "presubmit";
if (!["presubmit", "payload", "component", "registry"].includes(activeView)) activeView = "presubmit";
let activeGroupBy = localStorage.getItem("sippy_groupby") ?? "platform-release";
if (["platform-version", "platform-role"].includes(activeGroupBy)) activeGroupBy = "platform-release";
if (["version", "role"].includes(activeGroupBy)) activeGroupBy = "release";
if (!["", "platform", "release", "platform-release"].includes(activeGroupBy)) activeGroupBy = "platform-release";
let activePlatform = localStorage.getItem("sippy_platform") || "";
let healthSnapshot = null;
let collectionStatus = null;
let healthLoadPending = false;
let jobRegistry = null;
let registryLoadPending = false;
let releaseVersions = [];
let releaseMinIndex = 0;
let releaseMaxIndex = 0;
let releaseRangeInitialized = false;
let dashboardRenderFrame = null;

// --- Helpers ---

function sippyJobLink(jobName, release) {
  const filters = JSON.stringify({
    items: [{ columnField: "name", operatorValue: "equals", value: jobName }]
  });
  return `${SIPPY}/sippy-ng/jobs/${encodeURIComponent(release)}/analysis?filters=${encodeURIComponent(filters)}`;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function rateClass(rate, runs) {
  if (runs === 0) return "rate-na";
  if (rate >= 80) return "rate-good";
  if (rate >= 60) return "rate-warn";
  return "rate-bad";
}

function statusClass(rate, runs) {
  if (runs === 0) return "status-na";
  if (rate >= 80) return "status-good";
  if (rate >= 60) return "status-warn";
  return "status-bad";
}

function trendHtml(improvement) {
  if (improvement == null) return '<span class="trend-flat">—</span>';
  const val = improvement.toFixed(1);
  if (improvement > 1) return `<span class="trend-up">▲ +${val}</span>`;
  if (improvement < -1) return `<span class="trend-down">▼ ${val}</span>`;
  return `<span class="trend-flat">— ${val}</span>`;
}

function rateDeltaHtml(rate, prev, prevRuns, trend, runs, fails, testFails, infraFails) {
  if (runs === 0) return '';
  const lines = [];
  if (infraFails > 0) {
    lines.push(`${rate.toFixed(1)}% pass (${runs} runs) · ${testFails} test fail · ${infraFails} infra`);
  } else {
    lines.push(`${rate.toFixed(1)}% pass (${runs} runs, ${fails} fails)`);
  }
  lines.push(prevRuns > 0 ? `prev ${prev.toFixed(1)}%` : "no prev data");
  return `<span class="rate-delta has-tip"><span class="tip">${lines.join("<br>")}</span><span class="pass-rate ${rateClass(rate, runs)}">${rate.toFixed(0)}%</span> ${trendHtml(trend)}</span>`;
}

function formatAge(ms) {
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return "just now";
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hrs = Math.floor(min / 60);
  return `${hrs}h ${min % 60}m ago`;
}

function releaseRank(release) {
  const [major, minor] = release.split(".").map(Number);
  if (!Number.isInteger(major) || !Number.isInteger(minor)) return -1;
  if (major === 4) return minor;
  if (major >= 5) return 23 + (major - 5) * 100 + minor;
  return -1;
}

function initializeReleaseRange(releases) {
  const priorMin = releaseVersions[releaseMinIndex];
  const priorMax = releaseVersions[releaseMaxIndex];
  releaseVersions = [...new Set(releases || [])].sort((a, b) => releaseRank(b) - releaseRank(a));
  if (releaseVersions.length === 0) return;

  if (!releaseRangeInitialized) {
    const savedMin = localStorage.getItem("sippy_release_start");
    const savedMax = localStorage.getItem("sippy_release_end");
    const savedMinIndex = releaseVersions.indexOf(savedMin);
    const savedMaxIndex = releaseVersions.indexOf(savedMax);
    if (savedMinIndex >= 0 && savedMaxIndex >= savedMinIndex) {
      releaseMinIndex = savedMinIndex;
      releaseMaxIndex = savedMaxIndex;
    } else {
      releaseMinIndex = 0;
      releaseMaxIndex = Math.min(2, releaseVersions.length - 1);
    }
    releaseRangeInitialized = true;
  } else {
    releaseMinIndex = Math.max(0, releaseVersions.indexOf(priorMin));
    const priorMaxIndex = releaseVersions.indexOf(priorMax);
    releaseMaxIndex = priorMaxIndex >= releaseMinIndex ? priorMaxIndex : releaseVersions.length - 1;
  }

  const minInput = document.getElementById("release-min");
  const maxInput = document.getElementById("release-max");
  for (const input of [minInput, maxInput]) {
    input.min = 0;
    input.max = releaseVersions.length - 1;
    input.step = 1;
    input.disabled = releaseVersions.length === 1;
  }
  minInput.value = releaseMinIndex;
  maxInput.value = releaseMaxIndex;
  document.getElementById("release-range-ticks").innerHTML = releaseVersions
    .map(release => `<span>${esc(release)}</span>`).join("");
  updateReleaseRangeUI();
}

function updateReleaseRangeUI() {
  if (releaseVersions.length === 0) return;
  const minInput = document.getElementById("release-min");
  const maxInput = document.getElementById("release-max");
  minInput.value = releaseMinIndex;
  maxInput.value = releaseMaxIndex;
  minInput.style.zIndex = releaseMinIndex === releaseMaxIndex ? "3" : "2";
  maxInput.style.zIndex = "2";

  const denominator = Math.max(1, releaseVersions.length - 1);
  const left = 100 * releaseMinIndex / denominator;
  const right = 100 * releaseMaxIndex / denominator;
  const fill = document.getElementById("release-range-fill");
  fill.style.left = `${left}%`;
  fill.style.width = `${right - left}%`;

  const count = releaseMaxIndex - releaseMinIndex + 1;
  const first = releaseVersions[releaseMinIndex];
  const last = releaseVersions[releaseMaxIndex];
  document.getElementById("release-range-label").textContent =
    first === last ? first : `${first}–${last} · ${count} releases`;
  document.querySelectorAll("#release-range-ticks span").forEach((tick, index) => {
    tick.classList.toggle("selected", index >= releaseMinIndex && index <= releaseMaxIndex);
  });
}

function setReleaseBound(bound) {
  const value = Number(document.getElementById(`release-${bound}`).value);
  if (bound === "min") {
    releaseMinIndex = Math.min(value, releaseMaxIndex);
  } else {
    releaseMaxIndex = Math.max(value, releaseMinIndex);
  }
  localStorage.setItem("sippy_release_start", releaseVersions[releaseMinIndex]);
  localStorage.setItem("sippy_release_end", releaseVersions[releaseMaxIndex]);
  updateReleaseRangeUI();
  scheduleDashboardRender();
}

function scheduleDashboardRender() {
  if (dashboardRenderFrame !== null) return;
  dashboardRenderFrame = requestAnimationFrame(() => {
    dashboardRenderFrame = null;
    renderDashboard();
  });
}

function selectedReleases() {
  return releaseVersions.slice(releaseMinIndex, releaseMaxIndex + 1);
}

// --- Sparklines (use UTC for slot key alignment with server) ---

function buildSparkline(hourlyData, showDates, correlatedIndices) {
  if (showDates === undefined) showDates = true;
  if (!hourlyData) return "";
  const win = WINDOWS[activeWindow];
  const now = new Date();
  const slotData = [];
  for (let i = win.sparkSlots - 1; i >= 0; i--) {
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours()));
    const slotBase = Math.floor(t.getUTCHours() / win.sparkSlotHours) * win.sparkSlotHours;
    t.setUTCHours(slotBase - i * win.sparkSlotHours);
    const key = t.getUTCFullYear() + "-" +
      String(t.getUTCMonth() + 1).padStart(2, "0") + "-" +
      String(t.getUTCDate()).padStart(2, "0") + " " +
      String(t.getUTCHours()).padStart(2, "0") + ":00";
    slotData.push({ val: hourlyData[key] || null, day: t.getUTCDate(), month: t.getUTCMonth() + 1, key });
  }

  const gap = 1, dayGap = 4;
  const isDayBound = slotData.map((s, i) => i > 0 && s.day !== slotData[i - 1].day);
  const dayBounds = isDayBound.filter(Boolean).length;
  const totalGap = (win.sparkSlots - 1 - dayBounds) * gap + dayBounds * dayGap;
  const svgW = 300, barH = 20;
  const slotW = (svgW - totalGap) / win.sparkSlots;

  const corrSet = correlatedIndices ? new Set(correlatedIndices) : null;
  const hasCorr = corrSet && corrSet.size > 0;
  const markerH = hasCorr ? 6 : 0;
  const labelH = 12;
  const svgH = markerH + barH + ((showDates && dayBounds > 0) ? labelH : 0);
  const barY = markerH;

  let svg = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">`;
  let x = 0;
  const labels = [];
  const labelEveryDays = activeWindow === "1m" ? 5 : (activeWindow === "2w" ? 2 : 1);
  let dayBoundaryIndex = 0;
  for (let i = 0; i < win.sparkSlots; i++) {
    if (i > 0) {
      if (isDayBound[i]) {
        if (dayBoundaryIndex % labelEveryDays === 0) {
          labels.push({ x: x + dayGap / 2, text: `${slotData[i].month}/${slotData[i].day}` });
        }
        dayBoundaryIndex++;
        x += dayGap;
      } else {
        x += gap;
      }
    }
    const slot = slotData[i].val;
    let fill;
    if (!slot || slot.total_runs === 0) {
      fill = "var(--gridline)";
    } else {
      const s = (slot.result_count && slot.result_count.S) || 0;
      const ratio = s / slot.total_runs;
      if (ratio >= 0.8) fill = "var(--good)";
      else if (ratio >= 0.5) fill = "var(--warning)";
      else fill = "var(--critical)";
    }
    let tip;
    if (!slot) {
      tip = "no runs";
    } else {
      const rc = slot.result_count || {};
      const inf = (rc.n || 0) + (rc.N || 0);
      tip = inf > 0
        ? `${slot.total_runs} runs · ${rc.S || 0} pass · ${rc.F || 0} fail · ${inf} infra`
        : `${slot.total_runs} runs, ${rc.S || 0} pass`;
    }
    svg += `<rect x="${x}" y="${barY}" width="${slotW}" height="${barH}" rx="2" fill="${fill}" data-tip="${tip}"/>`;
    x += slotW;
  }
  if (hasCorr) {
    let mx = 0;
    for (let i = 0; i < win.sparkSlots; i++) {
      if (i > 0) mx += isDayBound[i] ? dayGap : gap;
      if (corrSet.has(i)) {
        svg += `<rect x="${mx}" y="0" width="${slotW}" height="4" rx="1" fill="var(--serious)" data-tip="periodic also failing — likely infra"/>`;
      }
      mx += slotW;
    }
  }
  if (showDates) {
    for (const l of labels) {
      svg += `<text x="${l.x}" y="${svgH - 1}" text-anchor="middle" font-size="9" font-family="system-ui,sans-serif" fill="var(--text-muted)">${l.text}</text>`;
    }
  }
  svg += "</svg>";
  return svg;
}

function extractErrorRates(sparklineData) {
  if (!sparklineData) return null;
  const win = WINDOWS[activeWindow];
  const now = new Date();
  const rates = [];
  const labels = [];
  for (let i = win.sparkSlots - 1; i >= 0; i--) {
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours()));
    const slotBase = Math.floor(t.getUTCHours() / win.sparkSlotHours) * win.sparkSlotHours;
    t.setUTCHours(slotBase - i * win.sparkSlotHours);
    const key = t.getUTCFullYear() + "-" +
      String(t.getUTCMonth() + 1).padStart(2, "0") + "-" +
      String(t.getUTCDate()).padStart(2, "0") + " " +
      String(t.getUTCHours()).padStart(2, "0") + ":00";
    labels.push(`${t.getUTCMonth()+1}/${t.getUTCDate()} ${String(t.getUTCHours()).padStart(2,'0')}:00`);
    const slot = sparklineData[key];
    if (!slot || slot.total_runs === 0) {
      rates.push(null);
    } else {
      const passRate = ((slot.result_count && slot.result_count.S) || 0) / slot.total_runs * 100;
      rates.push(+passRate.toFixed(1));
    }
  }
  return { rates, labels };
}

let pendingCharts = [];
let chartIdSeq = 0;

function externalRateTooltip(context) {
  const tip = document.getElementById('rate-tip');
  if (!tip) return;
  const { tooltip } = context;
  if (tooltip.opacity === 0) { tip.style.display = 'none'; return; }
  const lines = [];
  if (tooltip.title && tooltip.title[0]) lines.push(tooltip.title[0]);
  for (const dp of (tooltip.dataPoints || [])) {
    if (dp.parsed.y != null) lines.push(`${dp.parsed.y.toFixed(1)}% pass`);
  }
  tip.innerHTML = lines.join('<br>');
  const canvasRect = context.chart.canvas.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = (canvasRect.left + tooltip.caretX) + 'px';
  tip.style.top = (canvasRect.top - 28) + 'px';
}

function initRateCharts() {
  if (typeof Chart === 'undefined') return;
  const style = getComputedStyle(document.documentElement);
  const preColor = style.getPropertyValue('--series-1').trim() || '#2a78d6';
  const perColor = style.getPropertyValue('--series-2').trim() || '#eb6834';
  for (const { id, rates, labels, color } of pendingCharts) {
    const canvas = document.getElementById(id);
    if (!canvas) continue;
    const lineColor = color === 'per' ? perColor : preColor;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: rates,
          borderColor: lineColor,
          borderWidth: 1.5,
          pointRadius: 0,
          pointHitRadius: 8,
          tension: 0.3,
          fill: true,
          backgroundColor: lineColor + '14',
          spanGaps: true,
        }],
      },
      options: {
        responsive: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            mode: 'index',
            intersect: false,
            external: externalRateTooltip,
          },
        },
        layout: { padding: { top: 2 } },
        scales: {
          x: { display: false },
          y: { display: false, min: 0, max: 100 },
        },
        interaction: { mode: 'index', intersect: false },
      },
    });
  }
  pendingCharts = [];
}

// --- Alert banner ---

function buildAlertBanner(alerts) {
  const banner = document.getElementById("alert-banner");
  if (!alerts || alerts.length === 0) {
    banner.style.display = "none";
    return;
  }
  const displayed = alerts.slice(0, 8);
  banner.style.display = "block";
  let html = `<h2>${alerts.length} test${alerts.length > 1 ? "s" : ""} newly failing in the last 4 hours</h2><ul>`;
  for (const a of displayed) {
    html += `<li><span class="test-name">${esc(a.test_name)}</span>`;
    html += ` <span class="job-names">(${a.failure_count} failure${a.failure_count > 1 ? "s" : ""}`;
    if (a.jobs.length) html += ` in ${a.jobs.join(", ")}`;
    html += `)</span></li>`;
  }
  if (alerts.length > 8) {
    html += `<li style="color:var(--text-muted)">… and ${alerts.length - 8} more</li>`;
  }
  html += "</ul>";
  banner.innerHTML = html;
}

// --- Table rendering ---

function sortJobs(jobs) {
  return [...jobs].sort((a, b) => {
    const byName = (a.name || "").localeCompare(b.name || "");
    if (byName !== 0) return byName;
    return (a.prow || "").localeCompare(b.prow || "");
  });
}

function jobRelease(job) {
	if (job.target_release) return job.target_release;
  const periodic = job.periodics && job.periodics[0];
  return periodic ? periodic.release : job.release;
}

function releaseGroupLabel(release) {
  const index = releaseVersions.indexOf(release);
  if (index === 0) return `Future (${release})`;
  if (index > 0) return `N-${index} (${release})`;
  return release || "unknown";
}

function dimensionValue(job, dimension) {
  return dimension === "platform" ? platformLabel(job) : jobRelease(job) || "unknown";
}

function dimensionLabel(value, dimension) {
  return dimension === "release" ? releaseGroupLabel(value) : value;
}

function dimensionOrder(values, dimension) {
  if (dimension === "release") {
    return values.sort((a, b) => releaseVersions.indexOf(a) - releaseVersions.indexOf(b));
  }
  return values.sort((a, b) => a.localeCompare(b));
}

function groupedRows(jobs, rowBuilder) {
  if (!activeGroupBy) return sortJobs(jobs).map(rowBuilder).join("");
  const dimensions = activeGroupBy.split("-");
  const outer = dimensions[0];
  const groups = {};
  for (const job of jobs) {
    const value = dimensionValue(job, outer);
    if (!groups[value]) groups[value] = [];
    groups[value].push(job);
  }
  let html = "";
  for (const value of dimensionOrder(Object.keys(groups), outer)) {
    html += `<tr class="category-row"><td colspan="3">${esc(dimensionLabel(value, outer))}</td></tr>`;
    if (dimensions.length === 1) {
      html += sortJobs(groups[value]).map(rowBuilder).join("");
      continue;
    }
    const inner = dimensions[1];
    const subgroups = {};
    for (const job of groups[value]) {
      const innerValue = dimensionValue(job, inner);
      if (!subgroups[innerValue]) subgroups[innerValue] = [];
      subgroups[innerValue].push(job);
    }
    for (const innerValue of dimensionOrder(Object.keys(subgroups), inner)) {
      html += `<tr class="subcategory-row"><td colspan="3">${esc(dimensionLabel(innerValue, inner))}</td></tr>`;
      html += sortJobs(subgroups[innerValue]).map(rowBuilder).join("");
    }
  }
  return html;
}

function tableLegend(includeFailureExplanation) {
  return `<div class="sparkline-legend">
    <span><svg width="8" height="8"><rect width="8" height="8" rx="1" fill="var(--good)"/></svg> ≥80% pass</span>
    <span><svg width="8" height="8"><rect width="8" height="8" rx="1" fill="var(--warning)"/></svg> 50–80%</span>
    <span><svg width="8" height="8"><rect width="8" height="8" rx="1" fill="var(--critical)"/></svg> &lt;50%</span>
    <span><svg width="8" height="8"><rect width="8" height="8" rx="1" fill="var(--gridline)"/></svg> no runs</span>
  </div>${includeFailureExplanation ? `<div class="sparkline-legend">
    <span>fail = tests ran, some failed · infra = job errored before tests completed</span>
  </div>` : ""}`;
}

function buildHealthTable(jobs, title, emptyMessage, rowBuilder, includeFailureExplanation = false) {
  const win = WINDOWS[activeWindow];
  let rows = jobs.length > 0
    ? groupedRows(jobs, rowBuilder)
    : `<tr><td colspan="3" class="loading">${esc(emptyMessage)}</td></tr>`;
  return `<table>
    <thead><tr><th>${esc(title)}</th><th>Pass Rate</th><th>${win.sparkLabel}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>${tableLegend(includeFailureExplanation)}`;
}

function buildTable(jobs) {
  return buildHealthTable(
    jobs,
    "Job",
    "No presubmit jobs found for the selected filters.",
    buildRow,
    true,
  );
}

function buildPayloadTable(jobs) {
  return buildHealthTable(
    jobs,
    "Release payload job",
    "No release payload jobs found for the selected filters.",
    buildPayloadRow,
  );
}

function buildComponentReadinessTable(jobs) {
  return buildHealthTable(
    jobs,
    "Component Readiness job",
    "No standard-tier Component Readiness jobs found for the selected filters.",
    buildComponentReadinessRow,
  );
}

function buildRegistryTable(registry) {
  const jobs = [...(registry.jobs || [])].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  let html = `<div class="registry-toolbar">
    <input type="search" placeholder="Filter jobs…" aria-label="Filter job registry" oninput="filterRegistryJobs(this.value)">
    <span id="registry-count">${jobs.length} jobs</span>
    <a href="/api/job-registry" target="_blank" rel="noopener">Raw JSON API</a>
  </div>
  <table>
    <thead><tr>
      <th>Job</th>
      <th>Type</th>
      <th>Repository / context</th>
      <th>Versions / platforms</th>
      <th>Release participation</th>
    </tr></thead><tbody>`;

  for (const job of jobs) {
    const participation = (job.release_controller || []).map(p => {
      const stream = p.stream || {};
      const verification = p.verification || {};
      const label = `${stream.release || stream.name || "unknown"} · ${verification.role || "unknown"}`;
      return stream.release_status_url
        ? `<a href="${esc(stream.release_status_url)}" target="_blank" rel="noopener">${esc(label)}</a>`
        : esc(label);
    }).join("<br>") || "—";
    const versions = (job.versions || []).join(", ") || "—";
    const platforms = (job.platforms || []).join(", ") || "—";
    const context = job.context || "—";
    const jobLink = job.prow_job_history_url || (job.source && job.source.url) || "";
    const sippyLink = job.sippy_url || "";
    const registryEntryURL = `/api/job-registry/jobs/${encodeURIComponent(job.id)}`;
    const detailLinks = [
      sippyLink ? `<a href="${esc(sippyLink)}" target="_blank" rel="noopener">sippy</a>` : `<span>sippy unavailable</span>`,
      job.source && job.source.url ? `<a href="${esc(job.source.url)}" target="_blank" rel="noopener">source</a>` : "",
      `<a href="${registryEntryURL}?format=yaml" data-job-id="${esc(job.id)}" aria-expanded="false" onclick="toggleRegistryYAML(this); return false">registry YAML</a>`,
    ].filter(Boolean).join(" · ");
    const search = [job.name, job.type, job.repository, context, versions, platforms]
      .concat((job.release_controller || []).flatMap(p => [p.stream && p.stream.name, p.stream && p.stream.release, p.verification && p.verification.role]))
      .filter(Boolean).join(" ").toLowerCase();
    html += `<tr class="registry-job" data-search="${esc(search)}">
      <td class="job-name">${jobLink ? `<a href="${esc(jobLink)}" target="_blank" rel="noopener">${esc(job.name)}</a>` : esc(job.name)}<br><span class="registry-detail">${detailLinks}</span></td>
      <td><span class="job-type" style="margin-left:0">${esc(job.type)}</span></td>
      <td>${esc(job.repository || "—")}<br><span class="registry-detail">${esc(context)}</span></td>
      <td>${esc(versions)}<br><span class="registry-detail">${esc(platforms)}</span></td>
      <td>${participation}</td>
    </tr>`;
  }
  return html + "</tbody></table>";
}

function filterRegistryJobs(value) {
  const query = value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".registry-job").forEach(row => {
    const match = !query || row.dataset.search.includes(query);
    row.style.display = match ? "" : "none";
    const detail = row.nextElementSibling;
    if (detail && detail.classList.contains("registry-yaml-row")) {
      detail.hidden = !match || detail.dataset.expanded !== "true";
    }
    if (match) visible++;
  });
  const count = document.getElementById("registry-count");
  if (count) count.textContent = `${visible} job${visible === 1 ? "" : "s"}`;
}

function highlightRegistryYAML(yaml) {
  return yaml.split("\n").map(line => {
    const field = line.match(/^(\s*(?:-\s+)?)([A-Za-z0-9_-]+):(.*)$/);
    if (field) {
      const value = field[3];
      const trimmed = value.trim();
      let valueClass = "yaml-string";
      if (trimmed === "null" || trimmed === "~") valueClass = "yaml-null";
      else if (/^(true|false|-?\d+(?:\.\d+)?)$/.test(trimmed)) valueClass = "yaml-scalar";
      return `${esc(field[1])}<span class="yaml-key">${esc(field[2])}</span>:${trimmed ? `<span class="${valueClass}">${esc(value)}</span>` : ""}`;
    }
    const item = line.match(/^(\s*-\s+)(.*)$/);
    if (item) return `${esc(item[1])}<span class="yaml-string">${esc(item[2])}</span>`;
    return esc(line);
  }).join("\n");
}

async function toggleRegistryYAML(control) {
  const jobRow = control.closest("tr");
  let detail = jobRow.nextElementSibling;
  if (detail && detail.classList.contains("registry-yaml-row")) {
    const expanding = detail.dataset.expanded !== "true";
    detail.dataset.expanded = expanding ? "true" : "false";
    detail.hidden = !expanding;
    control.textContent = expanding ? "Hide Registry YAML" : "Registry YAML";
    control.setAttribute("aria-expanded", String(expanding));
    return;
  }

  jobRow.insertAdjacentHTML("afterend", `<tr class="registry-yaml-row" data-expanded="true"><td class="registry-yaml-cell"><div class="registry-yaml-panel"><pre>Loading registry entry…</pre></div></td><td class="registry-yaml-spacer" colspan="4"></td></tr>`);
  detail = jobRow.nextElementSibling;
  control.textContent = "Hide Registry YAML";
  control.setAttribute("aria-expanded", "true");
  const pre = detail.querySelector("pre");
  try {
    const resp = await fetch(control.href, {headers: {Accept: "application/yaml"}});
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    pre.innerHTML = `<code>${highlightRegistryYAML(await resp.text())}</code>`;
  } catch (err) {
    pre.textContent = `Failed to load registry entry: ${err.message}`;
  }
}

function platformLabel(job) {
  return (job.platforms || []).join(" / ") || "unknown";
}

function initializePlatformFilter(platforms) {
  const values = [...new Set(platforms || [])].sort((a, b) => a.localeCompare(b));
  if (activePlatform && !values.includes(activePlatform)) {
    activePlatform = "";
    localStorage.removeItem("sippy_platform");
  }
  const select = document.getElementById("platform-filter");
  select.innerHTML = '<option value="">All</option>' + values
    .map(platform => `<option value="${esc(platform)}">${esc(platform)}</option>`)
    .join("");
  select.value = activePlatform;
}

function filterByPlatform(jobs) {
  if (!activePlatform) return jobs;
  return jobs.filter(job => (job.platforms || []).includes(activePlatform));
}

function rateTrendHtml(rate, prev, prevRuns, trend, runs, fails) {
  if (runs === 0) return '<span class="rate-na">—</span>';
  const lines = [];
  lines.push(prevRuns > 0 ? `prev ${prev.toFixed(1)}%` : "no prev data");
  lines.push(`${runs} runs, ${fails} fails`);
  return `<div class="rate-cell has-tip"><span class="tip">${lines.join("<br>")}</span><span class="pass-rate ${rateClass(rate, runs)}">${rate.toFixed(1)}%</span> ${trendHtml(trend)}</div>`;
}

function relationshipTooltip(periodic) {
  const source = periodic.relationship_source ? `Source: ${periodic.relationship_source}` : "";
  const verification = periodic.relationship_verification ? `Verification: ${periodic.relationship_verification}` : "";
  return [periodic.relationship_rationale, source, verification].filter(Boolean).join(" · ");
}

function buildRow(j) {
  const preChartId = `rate-${++chartIdSeq}`;
  const pre = extractErrorRates(j.sparkline);
  pendingCharts.push({
    id: preChartId,
    rates: pre ? pre.rates : [],
    labels: pre ? pre.labels : [],
    color: 'pre',
  });

  const preInfraBadge = (j.infra_fails > 0 && j.spark_runs > 0 && j.infra_fails / j.spark_runs >= 0.15)
    ? `<span class="infra-badge has-tip"><span class="tip">${j.infra_fails} of ${j.spark_runs} runs were infrastructure failures — the job errored or timed out before tests could run. Not caused by PR code.</span>${j.infra_fails} infra</span>`
    : '';

  const hasPeriodics = j.periodics && j.periodics.length > 0;
  let html = `<tr>
    <td class="job-name"><span class="status-dot ${statusClass(j.rate, j.runs)}"></span><a href="${sippyJobLink(j.prow, "Presubmits")}" target="_blank">${esc(j.name)}</a><span class="job-type">presubmit</span>${preInfraBadge}</td>
    <td class="rate-chart-cell"><div class="rate-chart-inner"><canvas id="${preChartId}" width="140" height="28"></canvas>${rateDeltaHtml(j.rate, j.prev, j.prev_runs, j.trend, j.runs, j.fails, j.test_fails, j.infra_fails)}</div></td>
    <td class="sparkline-cell">${buildSparkline(j.sparkline, !hasPeriodics, j.correlation ? j.correlation.indices : null)}</td>
  </tr>`;

  for (const p of (j.periodics || [])) {
    const pRate = p.rate != null ? p.rate : 0;
    const pRuns = p.runs ?? 0;
    const perChartId = `rate-${++chartIdSeq}`;
    const per = extractErrorRates(p.sparkline);
    pendingCharts.push({
      id: perChartId,
      rates: per ? per.rates : [],
      labels: per ? per.labels : [],
      color: 'per',
    });
    const perSparkRuns = p.spark_runs ?? 0;
    const perInfraBadge = (p.infra_fails > 0 && perSparkRuns > 0 && p.infra_fails / perSparkRuns >= 0.15)
      ? `<span class="infra-badge has-tip"><span class="tip">${p.infra_fails} of ${perSparkRuns} runs were infrastructure failures — the job errored or timed out before tests could run.</span>${p.infra_fails} infra</span>`
      : '';
    const pairingTip = relationshipTooltip(p);
    const periodicBadge = pairingTip
      ? `<span class="job-type has-tip"><span class="tip">${esc(pairingTip)}</span>periodic ${esc(p.label)}</span>`
      : `<span class="job-type">periodic ${esc(p.label)}</span>`;
    html += `<tr class="periodic-row">
      <td class="job-name periodic-name"><span class="status-dot ${statusClass(pRate, pRuns)}"></span><a class="periodic-link" href="${sippyJobLink(p.prow, p.release)}" target="_blank">${esc(p.name)}</a>${periodicBadge}${perInfraBadge}</td>
      <td class="rate-chart-cell"><div class="rate-chart-inner"><canvas id="${perChartId}" width="140" height="28"></canvas>${rateDeltaHtml(pRate, p.prev != null ? p.prev : 0, p.prev_runs ?? 0, p.trend, pRuns, p.fails ?? 0, p.test_fails ?? 0, p.infra_fails ?? 0)}</div></td>
      <td class="sparkline-cell">${buildSparkline(p.sparkline)}</td>
    </tr>`;
  }

  return html;
}

function buildPeriodicHealthRow(p, badges, context) {
  const rate = p.rate != null ? p.rate : 0;
  const runs = p.runs ?? 0;
  const chartId = `rate-${++chartIdSeq}`;
  const chart = extractErrorRates(p.sparkline);
  pendingCharts.push({
    id: chartId,
    rates: chart ? chart.rates : [],
    labels: chart ? chart.labels : [],
    color: 'per',
  });
  const sparkRuns = p.spark_runs ?? 0;
  const infraBadge = (p.infra_fails > 0 && sparkRuns > 0 && p.infra_fails / sparkRuns >= 0.15)
    ? `<span class="infra-badge has-tip"><span class="tip">${p.infra_fails} of ${sparkRuns} runs were infrastructure failures — the job errored or timed out before tests could run.</span>${p.infra_fails} infra</span>`
    : '';
  return `<tr class="periodic-row">
    <td class="job-name"><span class="status-dot ${statusClass(rate, runs)}"></span><a href="${sippyJobLink(p.prow, p.release)}" target="_blank" rel="noopener">${esc(p.name)}</a>${badges}${infraBadge}${context || ""}</td>
    <td class="rate-chart-cell"><div class="rate-chart-inner"><canvas id="${chartId}" width="140" height="28"></canvas>${rateDeltaHtml(rate, p.prev != null ? p.prev : 0, p.prev_runs ?? 0, p.trend, runs, p.fails ?? 0, p.test_fails ?? 0, p.infra_fails ?? 0)}</div></td>
    <td class="sparkline-cell">${buildSparkline(p.sparkline)}</td>
  </tr>`;
}

function buildPayloadRow(p) {
  const participationLines = (p.participations || []).map(participation => {
    const streamName = participation.stream_name || "release stream";
    const streamKind = participation.stream_kind || "stream";
    const architecture = participation.architecture || "unknown architecture";
    const verification = participation.verification_name || "verification";
    const stream = participation.stream_sippy_url
      ? `<a href="${esc(participation.stream_sippy_url)}" target="_blank" rel="noopener">${esc(streamName)}</a>`
      : esc(streamName);
    const status = participation.release_status_url
      ? ` · <a href="${esc(participation.release_status_url)}" target="_blank" rel="noopener">payload status</a>`
      : "";
    return `${esc(verification)} · ${stream} · ${esc(streamKind)} / ${esc(architecture)}${status}`;
  });
  const context = participationLines.length > 0
    ? `<div class="perspective-context">${participationLines.join("<br>")}</div>`
    : "";
  return buildPeriodicHealthRow(p, "", context);
}

function buildComponentReadinessRow(p) {
  const registryWarning = p.registry_missing
    ? '<span class="infra-badge has-tip"><span class="tip">Sippy classifies this job as standard, but the generated registry has no current definition.</span>registry missing</span>'
    : '';
  return buildPeriodicHealthRow(p, registryWarning, "");
}

// --- Render orchestration ---

function filteredPresubmitJobs(jobs, selected) {
  const filtered = [];
  for (const job of jobs) {
	if (selected.has(jobRelease(job))) filtered.push(job);
  }
  return filtered;
}

function renderDashboard() {
  pendingCharts = [];
  chartIdSeq = 0;
  const dashboard = document.getElementById("dashboard");
  if (typeof Chart !== 'undefined') {
    dashboard.querySelectorAll('canvas').forEach(c => {
      const chart = Chart.getChart(c);
      if (chart) chart.destroy();
    });
  }
  const registryView = activeView === "registry";
  const payloadView = activeView === "payload";
  const componentView = activeView === "component";
  document.getElementById("group-toggle").style.display = registryView ? "none" : "inline-flex";
  document.getElementById("platform-filter-wrap").style.display = registryView ? "none" : "inline-flex";
  document.getElementById("window-toggle").style.display = registryView ? "none" : "inline-flex";
  document.getElementById("release-filter").style.display = registryView || releaseVersions.length === 0 ? "none" : "flex";
  if (registryView) {
    dashboard.innerHTML = jobRegistry
      ? buildRegistryTable(jobRegistry)
      : '<div class="loading">Loading job registry…</div>';
    buildAlertBanner([]);
    return;
  }

  if (!healthSnapshot) return;
  const windowData = healthSnapshot.windows[activeWindow];
  if (!windowData) return;
  const selected = new Set(selectedReleases());
  if (payloadView) {
    dashboard.innerHTML = buildPayloadTable(filterByPlatform(
      (windowData.payload_blocking_jobs || []).filter(job => selected.has(job.release)),
    ));
  } else if (componentView) {
    dashboard.innerHTML = buildComponentReadinessTable(filterByPlatform(
      (windowData.component_readiness_jobs || []).filter(job => selected.has(job.release)),
    ));
  } else {
    dashboard.innerHTML = buildTable(filterByPlatform(filteredPresubmitJobs(windowData.jobs || [], selected)));
  }
  buildAlertBanner(payloadView || componentView ? [] : windowData.alerts);
  initRateCharts();
}

async function loadJobRegistry() {
  if (jobRegistry || registryLoadPending) return;
  registryLoadPending = true;
  try {
    const resp = await fetch("/api/job-registry");
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    jobRegistry = await resp.json();
    if (activeView === "registry") renderDashboard();
  } catch (err) {
    console.error("Job registry load failed:", err);
    if (activeView === "registry") {
      document.getElementById("dashboard").innerHTML =
        `<div class="loading" style="color:var(--critical)">Failed to load job registry: ${esc(err.message)}</div>`;
    }
  } finally {
    registryLoadPending = false;
  }
}

function setStatus(text, cls) {
  const el = document.getElementById("last-updated");
  el.textContent = text;
  el.className = cls || "";
}

async function loadDashboard(forceRefresh = false) {
  if (healthLoadPending) return;
  healthLoadPending = true;
  const btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");
  try {
    const resp = await fetch("/api/health");
    if (resp.status === 503) {
      if (!healthSnapshot && activeView !== "registry") {
        setStatus("Waiting for data…", "cache-stale");
      }
      return;
    }
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    healthSnapshot = await resp.json();
    initializeReleaseRange(healthSnapshot.releases || []);
    initializePlatformFilter(healthSnapshot.platforms || []);
    renderDashboard();
    const age = Date.now() - new Date(healthSnapshot.generated_at).getTime();
    setStatus(`Updated ${formatAge(age)}`, "cache-fresh");
  } catch (err) {
    console.error("Dashboard refresh failed:", err);
    if (!healthSnapshot && activeView !== "registry") {
      document.getElementById("dashboard").innerHTML =
        `<div class="loading" style="color:var(--critical)">Failed to load: ${esc(err.message)}</div>`;
    } else {
      setStatus("Refresh failed", "cache-error");
    }
  } finally {
    healthLoadPending = false;
    btn.classList.remove("spinning");
  }
}

async function loadCollectionStatus() {
  try {
    const resp = await fetch("/api/health/status");
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    collectionStatus = await resp.json();
    renderCollectionStatus();
    if (collectionStatus.has_data && !healthSnapshot) loadDashboard();
  } catch (err) {
    console.error("Collection status refresh failed:", err);
  }
}

function renderCollectionStatus() {
  if (!collectionStatus) return;
  const s = collectionStatus;
  if (s.state === "collecting") {
    const total = s.total || 0;
    const completed = s.completed || 0;
    const detail = s.last_completed
      ? `Last completed: ${s.last_completed}${s.failed ? ` · ${s.failed} failed` : ""}`
      : "Waiting for Sippy responses…";
    setStatus(`Collecting ${completed}/${total}…`, s.failed ? "cache-error" : "cache-stale");
    if (!healthSnapshot && activeView !== "registry") {
      document.getElementById("dashboard").innerHTML = `<div class="loading">
        Loading Sippy data… ${completed}/${total}
        <progress value="${completed}" max="${total || 1}"></progress>
        <div class="loading-detail">${esc(detail)}</div>
      </div>`;
    }
    return;
  }
  if (s.state === "error") {
    setStatus("Collection failed", "cache-error");
    if (!healthSnapshot && activeView !== "registry") {
      document.getElementById("dashboard").innerHTML =
        `<div class="loading" style="color:var(--critical)">Sippy collection failed<div class="loading-detail">${esc(s.error || s.last_error || "Unknown error")}</div></div>`;
    }
  }
}

function setActiveWindow(w) {
  activeWindow = w;
  localStorage.setItem("sippy_window", w);
  document.querySelectorAll("#window-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.window === w);
  });
  renderDashboard();
}

function setActiveView(view) {
  activeView = view;
  localStorage.setItem("sippy_view", view);
  document.querySelectorAll("#view-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === view);
  });
  if (view === "registry") loadJobRegistry();
  renderDashboard();
}

function setGroupBy(g) {
  activeGroupBy = g;
  localStorage.setItem("sippy_groupby", g);
  document.querySelectorAll("#group-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.group === g);
  });
  renderDashboard();
}

function setPlatformFilter(platform) {
  activePlatform = platform;
  if (platform) localStorage.setItem("sippy_platform", platform);
  else localStorage.removeItem("sippy_platform");
  renderDashboard();
}

// --- Init ---

document.querySelectorAll("#window-toggle button").forEach(b => {
  b.classList.toggle("active", b.dataset.window === activeWindow);
});
document.querySelectorAll("#view-toggle button").forEach(b => {
  b.classList.toggle("active", b.dataset.view === activeView);
});
document.querySelectorAll("#group-toggle button").forEach(b => {
  b.classList.toggle("active", b.dataset.group === activeGroupBy);
});
loadDashboard();
loadCollectionStatus();
if (activeView === "registry") loadJobRegistry();
setInterval(() => loadDashboard(), 15 * 60 * 1000);
setInterval(() => loadCollectionStatus(), 1000);

const sparkTip = document.getElementById("spark-tip");
document.addEventListener("mouseover", e => {
  const rect = e.target.closest("[data-tip]");
  if (rect) {
    const r = rect.getBoundingClientRect();
    sparkTip.textContent = rect.dataset.tip;
    sparkTip.style.display = "block";
    sparkTip.style.left = r.left + "px";
    sparkTip.style.top = (r.top - 24) + "px";
  }
});
document.addEventListener("mouseout", e => {
  if (e.target.closest("[data-tip]")) sparkTip.style.display = "none";
});
</script>
