apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-health-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-health-refresher
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - ci-health
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-health-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-health-refresher
subjects:
  - kind: ServiceAccount
    name: ci-health-refresher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-health-refresh
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 330
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: ci-health-refresher
          restartPolicy: Never
          containers:
            - name: rollout
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  oc -n ci-health rollout restart deployment/ci-health
                  oc -n ci-health rollout status deployment/ci-health --timeout=5m
