apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-health
  labels:
    app: ci-health
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: ci-health
  template:
    metadata:
      labels:
        app: ci-health
    spec:
      initContainers:
        - name: generate-report-artifacts
          image: image-registry.openshift-image-registry.svc:5000/ci-health/ci-health:latest
          command:
            - /bin/sh
            - -ec
          args:
            - |
              git clone --depth=1 --filter=blob:none --no-tags --single-branch --sparse \
                https://github.com/openshift/release.git /tmp/openshift-release
              git -C /tmp/openshift-release sparse-checkout set \
                ci-operator/jobs \
                core-services/release-controller/_releases
              ci-health job-registry --release-dir=/tmp/openshift-release \
                > /var/lib/ci-health/job-registry.json
              ci-health report-plan \
                --job-registry=/var/lib/ci-health/job-registry.json \
                > /var/lib/ci-health/report-plan.json
              ci-health sippy-observation \
                --job-registry=/var/lib/ci-health/job-registry.json \
                --report-plan=/var/lib/ci-health/report-plan.json \
                > /var/lib/ci-health/sippy-observation.json
              ci-health health-report \
                --job-registry=/var/lib/ci-health/job-registry.json \
                --report-plan=/var/lib/ci-health/report-plan.json \
                --sippy-observation=/var/lib/ci-health/sippy-observation.json \
                > /var/lib/ci-health/health-report.json
          volumeMounts:
            - name: report-artifacts
              mountPath: /var/lib/ci-health
      containers:
        - name: ci-health
          image: image-registry.openshift-image-registry.svc:5000/ci-health/ci-health:latest
          args:
            - serve
            - --job-registry=/etc/ci-health/artifacts/job-registry.json
            - --report-plan=/etc/ci-health/artifacts/report-plan.json
            - --health-report=/etc/ci-health/artifacts/health-report.json
            - --sippy-observation=/etc/ci-health/artifacts/sippy-observation.json
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: report-artifacts
              mountPath: /etc/ci-health/artifacts
              readOnly: true
      volumes:
        - name: report-artifacts
          emptyDir: {}
